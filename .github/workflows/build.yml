name: build

# Builds what is missing from the artifact stores, once per platform (C library): glibc on a Debian image and musl on an
# Alpine image, so the artifacts (and the deb/rpm/apk packages made from them) exist for both families of systems.
# The pipeline itself is build-platform.yml. Triggers:
#   - dispatch (also used by watch-upstream on its bot branch)
#   - push to main touching the catalog / scripts      (a merged change that was never built)
#   - nightly schedule                                  (reconcile: expired GitHub artifacts, drift)

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Only these packages (space or comma separated; empty = everything stale)"
        required: false
        default: ""
      force:
        description: "Rebuild the selected packages even if their artifacts exist"
        type: boolean
        default: false
      reason:
        description: "Free text shown in the run summary"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - packages.yaml
      - config.yaml
      - assets/**
      - scripts/**
      - .github/workflows/build.yml
      - .github/workflows/build-platform.yml
  schedule:
    - cron: "41 3 * * *"
  workflow_call:
    inputs:
      packages: {type: string, required: false, default: ""}
      force: {type: boolean, required: false, default: false}

permissions:
  contents: read
  actions: read                      # list and download artifacts

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform:
    strategy:
      fail-fast: false               # a musl problem must not hide the glibc result, and the other way round
      matrix:
        libc: [glibc, musl]
    uses: ./.github/workflows/build-platform.yml
    with:
      libc: ${{ matrix.libc }}
      packages: ${{ inputs.packages || '' }}
      force: ${{ inputs.force || false }}
      reason: ${{ inputs.reason || '' }}
    secrets: inherit
