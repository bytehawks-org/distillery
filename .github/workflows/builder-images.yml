name: builder-images

# Builds the images in docker/ (builder: toolchain + python + gpg + bubblewrap + nfpm; runtime: a base for `autobuilder.py image --base`)
# so that CI jobs start from an image that already has everything instead of installing a toolchain every time.
#
#   pull request  -> build only (are the Dockerfiles still good?), linux/amd64
#   push to main  -> build and push ghcr.io/<owner>/bytehawks-{builder,runtime}:{glibc,musl} (amd64 + arm64)
#   manual        -> same, with the choice of pushing
#
# To make the build workflow use them, set the repository variables BH_BUILDER_IMAGE (glibc) and BH_BUILDER_IMAGE_MUSL
# to the pushed references (see docs/BUILDER-IMAGES.md). Without them the workflow keeps using plain debian:12 / alpine:3.20.

on:
  push:
    branches: [main]
    paths: ["docker/**", "scripts/requirements.txt", ".github/workflows/builder-images.yml"]
  pull_request:
    paths: ["docker/**", "scripts/requirements.txt", ".github/workflows/builder-images.yml"]
  workflow_dispatch:
    inputs:
      push:
        description: "push the images to ghcr.io"
        type: boolean
        default: true
  schedule:
    - cron: "17 3 * * 1"            # weekly: pick up base-image security updates

permissions:
  contents: read
  packages: write                   # push to ghcr.io (not used on pull requests)

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [builder, runtime]
        libc: [glibc, musl]
    env:
      PUSH: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: ${{ env.PUSH == 'true' }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "ref=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/bytehawks-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - name: Build${{ env.PUSH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}-${{ matrix.libc }}.Dockerfile
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.name.outputs.ref }}:${{ matrix.libc }}
            ${{ steps.name.outputs.ref }}:${{ matrix.libc }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.libc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.libc }}
