name: builder-images

# Builds the images in docker/ (builder: toolchain + python + gpg + bubblewrap + nfpm; runtime: a base for `autobuilder.py image --base`)
# so that CI jobs start from an image that already has everything instead of installing a toolchain every time.
#
#   pull request  -> build only (are the Dockerfiles still good?), linux/amd64
#   push to main  -> build and push ghcr.io/<owner>/bytehawks-{builder,runtime}:{glibc,musl} (amd64 + arm64)
#   manual        -> same, with the choice of pushing
#
# A second registry (a Nexus Docker registry, Harbor...) gets the same images when the repository variable BH_REGISTRY is set
# (e.g. registry.example.com; BH_REGISTRY_PATH is the path in it, default "bytehawks") with the secrets REGISTRY_USER / REGISTRY_PASSWORD
# (falling back to NEXUS_USER / NEXUS_PASSWORD).
#
# To make the build workflow use them, set the repository variables BH_BUILDER_IMAGE (glibc) and BH_BUILDER_IMAGE_MUSL
# to the pushed references (see docs/BUILDER-IMAGES.md). Without them the workflow keeps using plain debian:12 / alpine:3.20.

on:
  push:
    branches: [main]
    paths: ["docker/**", "scripts/requirements.txt", ".github/workflows/builder-images.yml"]
  pull_request:
    paths: ["docker/**", "scripts/requirements.txt", ".github/workflows/builder-images.yml"]
  workflow_dispatch:
    inputs:
      push:
        description: "push the images to ghcr.io"
        type: boolean
        default: true
  schedule:
    - cron: "17 3 * * 1"            # weekly: pick up base-image security updates

permissions:
  contents: read
  packages: write                   # push to ghcr.io (not used on pull requests)

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [builder, runtime]
        libc: [glibc, musl]
    env:
      PUSH: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: ${{ env.PUSH == 'true' }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to the second registry
        if: ${{ env.PUSH == 'true' && vars.BH_REGISTRY != '' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.BH_REGISTRY }}
          username: ${{ secrets.REGISTRY_USER || secrets.NEXUS_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.NEXUS_PASSWORD }}
      - name: Image name
        id: name
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/bytehawks-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          if [ "$PUSH" = "true" ] && [ -n "${BH_REGISTRY:-}" ]; then
            echo "second=${BH_REGISTRY}/${BH_REGISTRY_PATH:-bytehawks}/bytehawks-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          fi
        env:
          BH_REGISTRY: ${{ vars.BH_REGISTRY }}
          BH_REGISTRY_PATH: ${{ vars.BH_REGISTRY_PATH }}
      - name: Build${{ env.PUSH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}-${{ matrix.libc }}.Dockerfile
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.name.outputs.ref }}:${{ matrix.libc }}
            ${{ steps.name.outputs.ref }}:${{ matrix.libc }}-${{ github.sha }}
            ${{ steps.name.outputs.second && format('{0}:{1}', steps.name.outputs.second, matrix.libc) || '' }}
            ${{ steps.name.outputs.second && format('{0}:{1}-{2}', steps.name.outputs.second, matrix.libc, github.sha) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.libc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.libc }}
