name: Builder images

# Builds the Alpine/musl toolchain images (one per variant in config/config.yaml)
# and pushes them to GHCR (always) and Harbor (when HARBOR_* secrets exist).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # weekly: pick up Alpine security updates
  push:
    branches: [main]
    paths:
      - docker/**
      - requirements.txt
      - config/config.yaml

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: m
        run: python -m scripts.cli builder-matrix --format github

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      HARBOR_USER: ${{ secrets.HARBOR_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Harbor
        if: env.HARBOR_USER != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_URL || 'registry.bytehawks.org' }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Compute tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${{ matrix.image_fallback }}"
            [ -n "$HARBOR_USER" ] && echo "${{ matrix.image_primary }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/builder/Dockerfile
          build-args: |
            ALPINE_VERSION=${{ matrix.alpine_version }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
