name: ci
on:
  push:
  pull_request:
  workflow_dispatch:                 # also started by watch-upstream on its bot branches

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r scripts/requirements.txt
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: catalog is consistent (every source pinned, plans resolve)
        run: |
          python scripts/autobuilder.py list
          for p in $(python scripts/autobuilder.py list | awk '{print $1}'); do
            tag="$(python scripts/autobuilder.py list | awk -v p="$p" '$1==p{split($2,t,","); print t[1]}')"
            plan="$(python scripts/autobuilder.py plan --package "$p" --tag "$tag" --root /tmp/stage)"
            echo "$plan"
            if echo "$plan" | grep -q MISSING; then echo "::error::$p has an unpinned source"; exit 1; fi
          done

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install actionlint-py && actionlint
