version: 1.0.0
schema: "distillery-config"

config:
  # Global template variables
  variables:
    primary_registry_url: "registry.bytehawks.org"
    primary_registry_namespace: "bytehawks-org"
    artifact_base_path: "/opt/bytehawks"

  # Defaults
  defaults:
    build:
      variant: "stable"
      arch: "amd64"
      cleanup_on_success: true
      cleanup_on_failure: false
      # "container": the CLI spawns the builder image (local dev, Docker/Podman)
      # "native":    the CLI already runs inside the builder image (CI on K3s)
      executor: "container"
      jobs: "auto"
      # Toolchain flags applied to every step: static, hardened, reproducible.
      env:
        CFLAGS: "-O2 -pipe -fstack-protector-strong -D_FORTIFY_SOURCE=2 -ffile-prefix-map=/opt/bytehawks=."
        CXXFLAGS: "-O2 -pipe -fstack-protector-strong -D_FORTIFY_SOURCE=2 -ffile-prefix-map=/opt/bytehawks=."
        LDFLAGS: "-static -Wl,-z,relro,-z,now"

    packaging:
      format: "tar.gz"
      generate_checksum: true
      generate_sbom: true
      generate_signature: false  # Roadmap

  # Filesystem paths
  path:
    base: "{{ variables.artifact_base_path }}"
    downloads: "{{ path.base }}/tmp"
    sources: "{{ path.base }}/src"
    build: "{{ path.base }}/build"

    generated:
      libraries: "{{ path.base }}/deps"
      applications: "{{ path.base }}/apps/{{ package.name }}"

  # Build options
  option:
    build_user:
      name: "bh"
      group: "bh"
      uid: 1024
      gid: 1024
      homedir: "/home/bh"
      shell: "/bin/bash"

    runtime:
      tmpfs:
        enabled: true
        size: "2g"
        mount_point: "/tmp"

      fakeroot:
        enabled: true

      security:
        no_new_privileges: true
        drop_capabilities: ["ALL"]

  # Build configuration
  build:
    type:
      container:
        image_basename: "distillery-builder"
        runtime: "docker"  # or "podman"
        pull_policy: "if-not-present"

    variant:
      old-legacy:
        image: "{{ variables.primary_registry_url }}/{{ variables.primary_registry_namespace }}/{{ build.type.container.image_basename }}:{{ this.name }}"
        metadata:
          alpine_version: "3.15"
          musl_version: "1.2.2"
          kernel: "5.15"
          arch: "amd64"
        description: "Legacy infrastructure with long certification cycles"
        support_until: "2026-12-31"

      legacy:
        image: "{{ variables.primary_registry_url }}/{{ variables.primary_registry_namespace }}/{{ build.type.container.image_basename }}:{{ this.name }}"
        metadata:
          alpine_version: "3.20"
          musl_version: "1.2.5"
          kernel: "6.6"
          arch: "amd64"
        description: "Long-term stable for critical production"
        support_until: "2028-12-31"

      stable:
        image: "{{ variables.primary_registry_url }}/{{ variables.primary_registry_namespace }}/{{ build.type.container.image_basename }}:{{ this.name }}"
        metadata:
          alpine_version: "3.21"
          musl_version: "1.2.5"
          kernel: "6.6"
          arch: "amd64"
        description: "Current production standard"
        support_until: "2027-12-31"

      stream:
        image: "{{ variables.primary_registry_url }}/{{ variables.primary_registry_namespace }}/{{ build.type.container.image_basename }}:{{ this.name }}"
        metadata:
          alpine_version: "3.22"
          musl_version: "1.2.5"
          kernel: "6.12"
          arch: "amd64"
        description: "Bleeding edge for R&D and testing"
        support_until: "rolling"

  # Container registry (for build images)
  registry:
    strategy: "primary-with-fallback"

    primary:
      harbor:
        public: true
        url: "registry.bytehawks.org"
        namespace: "bytehawks-org"
        username: "${HARBOR_USER}"
        password: "${HARBOR_PASSWORD}"
        timeout: 30
        retry: 3

    fallback:
      ghcr:
        public: true
        url: "ghcr.io"
        namespace: "bytehawks-org"
        username: "${GITHUB_ACTOR}"
        token: "${GITHUB_TOKEN}"
        timeout: 30
        retry: 3

  # Artifact repository (for compiled binaries)
  # mirror-all: every artifact is published to the local Nexus AND to GitHub Releases
  repository:
    strategy: "mirror-all"

    primary:
      nexus:
        type: "nexus"
        # Local Nexus on the K3s node (override with NEXUS_URL; must end with /repository)
        url: "${NEXUS_URL:-http://nexus.nexus.svc.cluster.local:8081/repository}"
        repository: "bytehawks-packages"   # Nexus 'raw (hosted)' repository
        path_template: "{package}/{major_minor}/{full_version}"
        username: "${NEXUS_USER}"
        password: "${NEXUS_PASSWORD}"
        verify_tls: true
        timeout: 60
        retry: 3

    fallback:
      github:
        type: "github"
        # Repository holding one GitHub Release per package version
        repo: "bytehawks-org/artifacts"
        tag_template: "{package}-{full_version}"
        token: "${ARTIFACTS_GITHUB_TOKEN}"
        timeout: 120
        retry: 3

  # Logging and observability
  logging:
    level: "INFO"
    format: "json"
    output: "stdout"

  # GitHub integration (upstream monitoring)
  github:
    token: "${GITHUB_TOKEN}"
    api_url: "https://api.github.com"