          type: int
          cli: --global-max-clients
          description: See also the global_max_connections setting, and the max_connections setting, which applies to listeners.
        - name: BH_MOSQUITTO_GLOBAL_MAX_CONNECTIONS
          type: int
          cli: --global-max-connections
          description: The maximum number of currently connected clients to allow across the whole See also the global_max_clients and max_connections settings.
        - name: BH_MOSQUITTO_MAX_INFLIGHT_BYTES
          type: uint
          cli: --max-inflight-bytes
          description: QoS 1 and 2 messages will be allowed inflight per client until this limit is exceeded. Defaults to 0. (No maximum) See also max_inflight_messages
        - name: BH_MOSQUITTO_MAX_INFLIGHT_MESSAGES
          type: uint
          cli: --max-inflight-messages
          description: The maximum number of QoS 1 and 2 messages currently inflight per This includes messages that are partway through handshakes and those that are being retried....
        - name: BH_MOSQUITTO_MAX_KEEPALIVE
          type: uint
          cli: --max-keepalive
          description: For MQTT v3.1.1 and v3.1 clients, there is no mechanism to tell the client what keepalive value they should use.
        - name: BH_MOSQUITTO_MAX_PACKET_SIZE
          type: uint
          cli: --max-packet-size
          description: For MQTT v5 clients, it is possible to have the server send a "maximum packet size" value that will instruct the client it will not accept MQTT packets with...
        - name: BH_MOSQUITTO_MAX_QUEUED_BYTES
          type: uint
          cli: --max-queued-bytes
          description: QoS 1 and 2 messages above those currently in-flight will be queued per client until this limit is exceeded. Defaults to 0.
        - name: BH_MOSQUITTO_MAX_QOS
          type: uint
          cli: --max-qos
          description: Set the maximum QoS supported. Clients publishing at a QoS higher than specified here will be disconnected.
        - name: BH_MOSQUITTO_MAX_QUEUED_MESSAGES
          type: uint
          cli: --max-queued-messages
          description: The maximum number of QoS 1 and 2 messages to hold in a queue per client above those that are currently in-flight. Defaults to 1000.
        - name: BH_MOSQUITTO_MEMORY_LIMIT
