  # Binary repack of the upstream release (a static Go binary: the same file runs on glibc and musl). The two settings of the
  # configuration file come from `autobuilder.py scaffold --format yaml`; the command-line flags that define where it listens
  # and where it stores data are declared by hand (scaffold reads configuration files, not `--help` output).
  prometheus:
    variant:
      - name: stable
        major_version: 3.15
        patch_version: 1
        full_version: 3.15.1
        sha256:
          amd64: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
          arm64: ceb6d21493c37ca0b4513b147642797c68cf39a0f50a444d50e1e80c74f21b26
    arch_map: {amd64: amd64, arm64: arm64}
    license: Apache-2.0
    website: https://prometheus.io/
    git:
      repo: https://github.com/prometheus/prometheus
      release_download_url_template: "{{ git.repo }}/releases/download/v{{ full_version }}/{{ name }}-{{ full_version }}.linux-{{ arch_name }}.tar.gz"
    upstream:
      tag_regex: '^v(\d+\.\d+\.\d+)$'
    commands:
      install: |
        mkdir -p {{ prefix }}/bin
        install -m 0755 prometheus promtool {{ prefix }}/bin/
    runtime:
      user:
        name: prometheus
        uid: 1004
        gid: 0
        home: "{{ prefix }}"
      dirs:
        - {path: "{{ prefix }}/conf", mode: "g+rwX", owner: "1004:0"}
        - {path: "{{ prefix }}/data", mode: "g+rwX", owner: "1004:0"}
      persistence:
        - {path: "{{ prefix }}/data", volume: /bytehawks/data}
      run:
        command:
          - "{{ prefix }}/bin/prometheus"
          - --config.file={{ prefix }}/conf/prometheus.yml
          - --storage.tsdb.path=${BH_PROMETHEUS_DATA_DIR}
          - --storage.tsdb.retention.time=${BH_PROMETHEUS_RETENTION}
          - --web.listen-address=${BH_PROMETHEUS_HOST}:${BH_PROMETHEUS_PORT}
        stop_signal: TERM
      healthcheck:
        tcp: {host: 127.0.0.1, port: "${BH_PROMETHEUS_PORT}"}
      env:
        - {name: BH_PROMETHEUS_HOST, type: string, default: 0.0.0.0, cli: --host, description: "Interface the web UI and API listen on"}
        - {name: BH_PROMETHEUS_PORT, type: port, default: 9090, cli: --port, description: "Port of the web UI and API"}
        - {name: BH_PROMETHEUS_RETENTION, type: string, default: 15d, cli: --retention, description: "How long samples are kept (--storage.tsdb.retention.time)"}
        - {name: BH_PROMETHEUS_DATA_DIR, type: path, default: "{{ prefix }}/data", cli: --data-dir, description: "Time series database directory (mount a volume here)"}
        - name: BH_PROMETHEUS_GLOBAL_SCRAPE_INTERVAL
          type: string
          default: 15s
          file_key: global.scrape_interval
          cli: --global-scrape-interval
          description: Set the scrape interval to every 15 seconds. Default is every 1 minute.
        - name: BH_PROMETHEUS_GLOBAL_EVALUATION_INTERVAL
          type: string
          default: 15s
          file_key: global.evaluation_interval
          cli: --global-evaluation-interval
          description: Evaluate rules every 15 seconds. The default is every 1 minute.
      templates:
        - src: prometheus.yml.tmpl
          dest: '{{ prefix }}/conf/prometheus.yml'
          mode: '0640'
    tags:
      - application

  # Built from a git tag pinned by commit. runtime.env and the template come from `autobuilder.py scaffold` run on the
  # mosquitto.conf the project ships (every setting there is a commented default, hence `--commented strict`); the four
  # `--default` values below are the only choices made by hand. Needs cJSON; OpenSSL is linked statically (hence -fPIC in
  # its recipe and the explicit -lssl -lcrypto after the common library: static archives are order sensitive).
  #   autobuilder.py scaffold --package mosquitto --from mosquitto.conf --commented strict --write \
  #     --exclude '^(user|include_dir|pid_file|plugin.*|persistence_file)$' \
  #     --default listener=1883 --default persistence=true --default persistence_location='{{ prefix }}/data/' \
  #     --default log_dest=stdout
  mosquitto:
    variant:
      - name: stable
        major_version: 2.1
        patch_version: 2
        full_version: 2.1.2
        commit: 99fa50f30e325609394c324c8ff71cfbbe95d8ab
    license: EPL-2.0
    website: https://mosquitto.org/
    depends_on:
      - {name: openssl, variant: stable}
      - cjson
    git:
      repo: https://github.com/eclipse-mosquitto/mosquitto
      ref_template: "v{{ full_version }}"
    upstream:
      tag_regex: '^v(\d+\.\d+\.\d+)$'
    env:
      # the clients load libmosquitto.so from the prefix: no LD_LIBRARY_PATH needed (and no system library path assumed)
      LDFLAGS: "-L{{ deps_prefix }}/lib -L{{ deps_prefix }}/lib64 -Wl,-rpath,{{ prefix }}/lib"
    commands:
      make: |
        make -j{{ jobs }} WITH_DOCS=no WITH_WEBSOCKETS=no WITH_SYSTEMD=no WITH_TLS=yes WITH_EDITLINE=no WITH_HTTP_API=no \
          LIBMOSQ_COMMON='-Wl,--whole-archive ${R}/libcommon/libmosquitto_common.a -Wl,--no-whole-archive -lcjson -lssl -lcrypto'
      install: |
        make install prefix={{ prefix }} WITH_DOCS=no WITH_WEBSOCKETS=no WITH_SYSTEMD=no WITH_TLS=yes WITH_EDITLINE=no WITH_HTTP_API=no \
          LIBMOSQ_COMMON='-Wl,--whole-archive ${R}/libcommon/libmosquitto_common.a -Wl,--no-whole-archive -lcjson -lssl -lcrypto'
    # Static: libmosquitto as an archive (the clients link it), the broker and the tools without a dynamic loader. The shared
    # objects the Makefile builds anyway (libcommon) cannot be linked with -static, so only the final links get it. Plugins
    # are dlopen()ed objects, which a static executable cannot load.
    static:
      binaries: [sbin/mosquitto, bin/mosquitto_pub, bin/mosquitto_sub, bin/mosquitto_rr, bin/mosquitto_passwd]
      commands:
        make: |
          OPTS="WITH_DOCS=no WITH_WEBSOCKETS=no WITH_SYSTEMD=no WITH_TLS=yes WITH_EDITLINE=no WITH_HTTP_API=no WITH_SHARED_LIBRARIES=no WITH_STATIC_LIBRARIES=yes"
          COMMON='-Wl,--whole-archive ${R}/libcommon/libmosquitto_common.a -Wl,--no-whole-archive -lcjson -lssl -lcrypto -ldl -pthread'
          make -j{{ jobs }} -C libcommon $OPTS
          make -j{{ jobs }} -C lib $OPTS
          for d in src client apps/mosquitto_passwd; do
            make -j{{ jobs }} -C $d $OPTS LIBMOSQ_COMMON="$COMMON" LDFLAGS="-L{{ deps_prefix }}/lib -L{{ deps_prefix }}/lib64 -static"
          done
        install: |
          OPTS="WITH_DOCS=no WITH_WEBSOCKETS=no WITH_SYSTEMD=no WITH_TLS=yes WITH_EDITLINE=no WITH_HTTP_API=no WITH_SHARED_LIBRARIES=no WITH_STATIC_LIBRARIES=yes"
          COMMON='-Wl,--whole-archive ${R}/libcommon/libmosquitto_common.a -Wl,--no-whole-archive -lcjson -lssl -lcrypto -ldl -pthread'
          for d in lib src client apps/mosquitto_passwd; do
            make -C $d install prefix={{ prefix }} $OPTS LIBMOSQ_COMMON="$COMMON" LDFLAGS="-L{{ deps_prefix }}/lib -L{{ deps_prefix }}/lib64 -static"
          done
    runtime:
      user:
        name: mosquitto
        uid: 1005
        gid: 0
        home: "{{ prefix }}"
      dirs:
        - {path: "{{ prefix }}/conf", mode: "g+rwX", owner: "1005:0"}
        - {path: "{{ prefix }}/data", mode: "g+rwX", owner: "1005:0"}
        - {path: "{{ prefix }}/run", mode: "g+rwX", owner: "1005:0"}
      persistence:
        - {path: "{{ prefix }}/data", volume: /bytehawks/data}
      run:
        command:
          - "{{ prefix }}/sbin/mosquitto"
          - -c
          - "{{ prefix }}/conf/mosquitto.conf"
        stop_signal: TERM
      healthcheck:
        tcp: {host: 127.0.0.1, port: "${BH_MOSQUITTO_HEALTH_PORT}"}
      env:
        - {name: BH_MOSQUITTO_HEALTH_PORT, type: port, default: 1883, cli: --health-port, description: "Port the health check probes: keep it equal to the (first) listener"}
        - name: BH_MOSQUITTO_PER_LISTENER_SETTINGS
          type: enum:true,false
          cli: --per-listener-settings
          description: The default behaviour is for this to be set to false, which maintains the setting behaviour from previous versions of mosquitto.
        - name: BH_MOSQUITTO_ALLOW_ZERO_LENGTH_CLIENTID
          type: enum:true,false
          cli: --allow-zero-length-clientid
          description: This option controls whether a client is allowed to connect with a zero length client id or not.
        - name: BH_MOSQUITTO_AUTO_ID_PREFIX
          type: string
          cli: --auto-id-prefix
          description: If allow_zero_length_clientid is true, this option allows you to set a prefix to automatically generated client ids to aid visibility in logs.
        - name: BH_MOSQUITTO_CHECK_RETAIN_SOURCE
          type: enum:true,false
          cli: --check-retain-source
          description: This option affects the scenario when a client subscribes to a topic that has retained messages.
