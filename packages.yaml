  # The tool `autobuilder.py package` uses to write deb/rpm/apk. Prebuilt Go binary; the archive has no top directory.
  # Upstream publishes one checksums.txt for all files, so no checksum_url_template (the pin is still sha256 per arch).
  nfpm:
    variant:
      - name: stable
        major_version: 2.48
        patch_version: 0
        full_version: 2.48.0
        sha256:
          amd64: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
          arm64: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4
    arch_map: {amd64: x86_64, arm64: arm64}
    license: MIT
    website: https://nfpm.goreleaser.com/
    strip_components: 0
    git:
      repo: https://github.com/goreleaser/nfpm
      release_download_url_template: "{{ git.repo }}/releases/download/v{{ full_version }}/{{ name }}_{{ full_version }}_Linux_{{ arch_name }}.tar.gz"
    upstream:
      tag_regex: '^v(\d+\.\d+\.\d+)$'
    commands:
      install: |
        mkdir -p {{ prefix }}/bin
        install -m 0755 nfpm {{ prefix }}/bin/nfpm
    tags:
      - application

