# Package catalog.
#
# Templates: {{ name }}, {{ full_version }}, {{ prefix }}, {{ deps_prefix }}, {{ jobs }},
#            {{ src_dir }}, {{ git.repo }}, {{ config.* }} ...  (resolved by Distillery, strict)
# Runtime text: ${BH_PKG_VAR} is left untouched and expanded by Shaker at runtime.
# Every variant MUST pin the sha256 of its source tarball.
# `upstream:` lets `autobuilder.py outdated|bump` follow new releases; a variant follows the series
# named by its major_version (override with `track:`). Quote versions that end in 0 ("1.30").
#
# See docs/PACKAGES.md for the complete reference.

package:

  openssl:
    variant:
      - name: [old-legacy, legacy]
        major_version: 3.0
        patch_version: 18
        full_version: 3.0.18
        sha256: d80c34f5cf902dccf1f1b5df5ebb86d0392e37049e5d73df1b3abae72e4ffe8b
      - name: stable
        major_version: 3.5
        patch_version: 4
        full_version: 3.5.4
        sha256: 967311f84955316969bdb1d8d4b983718ef42338639c621ec4c34fddef355e99
      - name: stream
        major_version: 3.6
        patch_version: 0
        full_version: 3.6.0
        sha256: b6a5f44b7eb69e3fa35dbf15524405b44837a481d43d81daddde3ff21fcbb8e9
    arch_map: {amd64: linux-x86_64, arm64: linux-aarch64}      # OpenSSL's Configure target (musl and glibc alike)
    license: Apache-2.0
    website: https://www.{{ name }}.org/
    git:
      repo: https://github.com/{{ name }}/{{ name }}
      release_url_name_template: "{{ name }}-{{ full_version }}.tar.gz"
      release_download_url_template: "{{ git.repo }}/releases/download/{{ name }}-{{ full_version }}/{{ name }}-{{ full_version }}.tar.gz"
    commands:
      configure: |
        ./Configure {{ arch_name }} \
          --prefix={{ prefix }} \
          --libdir=lib \
          --openssldir={{ prefix }}/etc/ssl \
          -static \
          no-shared \
          no-tests \
          no-docs
      make: make -j{{ jobs }}
      install: make install_sw install_ssldirs
    upstream:
      tag_regex: '^openssl-(\d+\.\d+\.\d+)$'
      checksum_url_template: "{{ git.release_download_url_template }}.sha256"
    runtime:
      env:
        - name: BH_OPENSSL_CONF
          type: path
          default: "{{ prefix }}/etc/ssl/openssl.cnf"
          aliases: [OPENSSL_CONF]
          file_key: openssl.conf
          cli: --conf
          native_env: OPENSSL_CONF
          description: OpenSSL configuration file
        - name: BH_OPENSSL_CERT_DIR
          type: path
          default: "{{ prefix }}/etc/ssl/certs"
          aliases: [SSL_CERT_DIR]
          file_key: openssl.cert_dir
          native_env: SSL_CERT_DIR
          description: Trusted CA certificates directory
    tags:
      - library
      - application

  zlib:
    variant:
      - name: all
        major_version: 1.3
        patch_version: 1
        full_version: 1.3.1
        sha256: 9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23
    license: Zlib
    website: https://zlib.net/
    git:
      repo: https://github.com/madler/zlib
      release_download_url_template: "{{ git.repo }}/releases/download/v{{ full_version }}/{{ name }}-{{ full_version }}.tar.gz"
    upstream:
      tag_regex: '^v(\d+\.\d+\.\d+)$'
    commands:
      configure: ./configure --prefix={{ prefix }} --static
      make: make -j{{ jobs }}
      install: make install
    tags:
      - library

  pcre2:
    variant:
      - name: all
        major_version: 10
        patch_version: 43
        full_version: 10.43
        sha256: 889d16be5abb8d05400b33c25e151638b8d4bac0e2d9c76e9d6923118ae8a34e
    license: BSD-3-Clause
    website: https://www.pcre.org/
    git:
      repo: https://github.com/PCRE2Project/pcre2
      release_download_url_template: "{{ git.repo }}/releases/download/{{ name }}-{{ full_version }}/{{ name }}-{{ full_version }}.tar.gz"
    upstream:
      tag_regex: '^pcre2-(\d+\.\d+)$'
    commands:
      configure: ./configure --prefix={{ prefix }} --disable-shared --enable-static --enable-jit
      make: make -j{{ jobs }}
      install: make install
    tags:
      - library

  nginx:
    variant:
      - name: stable
        major_version: 1.28
        patch_version: 0
        full_version: 1.28.0
        sha256: c6b5c6b086c0df9d3ca3ff5e084c1d0ef909e6038279c71c1c3e985f576ff76a
    license: BSD-2-Clause
    website: https://nginx.org/
    depends_on:
      - {name: openssl, variant: stable}
      - zlib
      - pcre2
    git:
      repo: https://github.com/nginx/nginx
      release_download_url_template: "{{ git.repo }}/releases/download/release-{{ full_version }}/{{ name }}-{{ full_version }}.tar.gz"
    upstream:
      tag_regex: '^release-(\d+\.\d+\.\d+)$'
    commands:
      configure: |
        ./configure \
          --prefix={{ prefix }} \
          --conf-path={{ prefix }}/conf/nginx.conf \
          --error-log-path=stderr \
          --http-log-path=/dev/stdout \
          --pid-path={{ prefix }}/run/nginx.pid \
          --http-client-body-temp-path={{ prefix }}/run/client_body \
          --http-proxy-temp-path={{ prefix }}/run/proxy \
          --http-fastcgi-temp-path={{ prefix }}/run/fastcgi \
          --http-uwsgi-temp-path={{ prefix }}/run/uwsgi \
          --http-scgi-temp-path={{ prefix }}/run/scgi \
          --with-http_ssl_module \
          --with-http_v2_module \
          --with-http_stub_status_module \
          --with-cc-opt="-I{{ deps_prefix }}/include" \
          --with-ld-opt="-L{{ deps_prefix }}/lib"
      make: make -j{{ jobs }}
      install: make install
    runtime:
      user:
        name: nginx
        uid: 1001
        gid: 0
        home: "{{ prefix }}"
      dirs:
        - {path: "{{ prefix }}/run", mode: "g+rwX", owner: "1001:0"}
        - {path: "{{ prefix }}/conf", mode: "g+rwX", owner: "1001:0"}
        - {path: "{{ prefix }}/html", mode: "g+rX", owner: "1001:0"}
      templates:
        - {src: nginx.conf.tmpl, dest: "{{ prefix }}/conf/nginx.conf", mode: "0640"}
      hooks:
        pre_init: "{{ prefix }}/hooks/pre-init.d"
        first_init: "{{ prefix }}/hooks/init.d"
        post_init: "{{ prefix }}/hooks/post-init.d"
      run:
        command:
          - "{{ prefix }}/sbin/nginx"
          - -c
          - "{{ prefix }}/conf/nginx.conf"
          - -g
          - "daemon off;"
        stop_signal: QUIT
        pidfile: "{{ prefix }}/run/nginx.pid"
      healthcheck:
        tcp: {host: 127.0.0.1, port: "${BH_NGINX_PORT}"}
      requires: [openssl]
      env:
        - name: BH_NGINX_PORT
          type: port
          default: 8080
          aliases: [NGINX_HTTP_PORT_NUMBER]     # Bitnami dialect
          file_key: server.port
          cli: --port
          description: HTTP listen port
        - name: BH_NGINX_WORKER_PROCESSES
          type: string
          default: auto
          file_key: server.worker_processes
          cli: --worker-processes
          description: Number of worker processes (number or auto)
        - name: BH_NGINX_SERVER_NAME
          type: string
          default: _
          file_key: server.name
          cli: --server-name
          description: Value of the server_name directive
        - name: BH_NGINX_ACCESS_LOG
          type: string
          default: /dev/stdout
          file_key: logging.access_log
          cli: --access-log
          description: access_log target (path, "off"); /dev/stdout may be refused to arbitrary uids on some runtimes
        - name: BH_NGINX_SERVER_TOKENS
          type: enum:on,off
          default: "off"
          file_key: server.tokens
          cli: --server-tokens
          description: Expose the nginx version in headers and error pages
    tags:
      - application

  # Binary repack: the JRE NiFi runs on, as a unit of its own (prefix /opt/bytehawks/temurin).
  # The artifact and its sha256 are per architecture: arch_map translates our names to Adoptium's.
  temurin:
    variant:
      - name: stable
        major_version: 21
        patch_version: 0
        full_version: 21.0.9
        build: 10
        sha256:                                     # per platform: <arch> (glibc) and <arch>-musl (Alpine builds)
          amd64: aeab55d064a1a27a3744b0880b9b414077b4ed2b1790817eea3df60aec946431
          arm64: 1d041073c65e834bdb4da732485a54ff829859dcd1549e7992f15bd73341be29
          amd64-musl: 17aca4ecc1600f70ec88ea0f8bf3a06ba6806bdae8c96d03c07683c800f0d4e8
          arm64-musl: 7f8c230ba505b418e4288e2b34758a6e4da32470944740e5ba0cfaae02271c22
    arch_map: {amd64: x64, arm64: aarch64}
    libc_map: {glibc: linux, musl: alpine-linux}
    license: GPL-2.0-with-classpath-exception
    website: https://adoptium.net/
    git:
      repo: https://github.com/adoptium/temurin{{ major_version }}-binaries
      release_download_url_template: "{{ git.repo }}/releases/download/jdk-{{ full_version }}%2B{{ variant.build }}/OpenJDK{{ major_version }}U-jre_{{ arch_name }}_{{ libc_name }}_hotspot_{{ full_version }}_{{ variant.build }}.tar.gz"
    # Signature made with the Adoptium key; the fingerprint below is the trust anchor, the key is fetched by it.
    signature:
      type: gpg
      url_template: "{{ git.release_download_url_template }}.sig"
      keys_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x3B04D753C9050D9A5D343F39843C48A565F8F04B"
      fingerprints:
        - 3B04D753C9050D9A5D343F39843C48A565F8F04B
    commands:
      install: |
        mkdir -p {{ prefix }}
        cp -a . {{ prefix }}/
    tags:
      - application

  # Binary repack of the Apache distribution (zip): nothing is compiled. Upstream publishes sha512 only.
  nifi:
    variant:
      - name: stable
        major_version: 2.9
        patch_version: 0
        full_version: 2.9.0
        sha256: 3376074740d632160aa3916104fd8ee7fbb7630eeda5b4ef319bc1a52d9a6e06
    license: Apache-2.0
    website: https://nifi.apache.org/
    depends_on:
      - {name: temurin, variant: stable, tag: application}
    git:
      repo: https://github.com/apache/nifi
      release_download_url_template: "https://archive.apache.org/dist/nifi/{{ full_version }}/{{ name }}-{{ full_version }}-bin.zip"
    upstream:
      tag_regex: '^rel/nifi-(\d+\.\d+\.\d+)$'
      checksum_url_template: "{{ git.release_download_url_template }}.sha512"
    # Release managers sign with their own key: a release signed by someone new fails until the fingerprint is reviewed.
    signature:
      type: gpg
      keys_url: https://downloads.apache.org/nifi/KEYS
      fingerprints:
        - 3FE925C2BED744021E6169A2F92A93B30C07C6D5      # Pierre Villard, 2.9.0
    commands:
      install: |
        mkdir -p {{ prefix }}
        cp -a . {{ prefix }}/
    runtime:
      user:
        name: nifi
        uid: 1002
        gid: 0
        home: "{{ prefix }}"
      dirs:
        - {path: "{{ prefix }}/conf", mode: "g+rwX", owner: "1002:0"}
        - {path: "{{ prefix }}/logs", mode: "g+rwX", owner: "1002:0"}
        - {path: "{{ prefix }}/work", mode: "g+rwX", owner: "1002:0"}
        - {path: "{{ prefix }}/run", mode: "g+rwX", owner: "1002:0"}
        - {path: "{{ prefix }}/data", mode: "g+rwX", owner: "1002:0"}
      persistence:
        - {path: "{{ prefix }}/data", volume: /bytehawks/data}
      mutable:                                  # rewritten at every start by the post_init hook: not an integrity violation
        - "{{ prefix }}/conf"
      hooks:
        post_init: "{{ prefix }}/hooks/post-init.d"
      run:
        command:
          - "{{ prefix }}/bin/nifi.sh"
          - run
        stop_signal: TERM
      healthcheck:
        tcp: {host: 127.0.0.1, port: "${BH_NIFI_PORT}"}
      env:
        - name: BH_NIFI_PORT
          type: port
          default: 8443
          aliases: [NIFI_WEB_HTTPS_PORT]
          file_key: web.https.port
          cli: --port
          description: HTTPS listen port
        - name: BH_NIFI_HOST
          type: string
          default: 0.0.0.0
          aliases: [NIFI_WEB_HTTPS_HOST]
          file_key: web.https.host
          cli: --host
          description: Interface NiFi binds to
        - name: BH_NIFI_PROXY_HOSTS
          type: string
          default: ""
          aliases: [NIFI_WEB_PROXY_HOST]
          file_key: web.proxy.host
          cli: --proxy-hosts
          description: Comma separated host[:port] values accepted in the Host header (reverse proxy, external names)
        - name: BH_NIFI_USERNAME
          type: string
          default: admin
          aliases: [SINGLE_USER_CREDENTIALS_USERNAME]
          file_key: security.username
          cli: --username
          description: Single user login
        - name: BH_NIFI_PASSWORD
          type: secret
          required: true
          aliases: [SINGLE_USER_CREDENTIALS_PASSWORD]
          file_key: security.password
          cli: --password
          description: Single user password (at least 12 characters)
        - name: BH_NIFI_SENSITIVE_PROPS_KEY
          type: secret
          required: true
          aliases: [NIFI_SENSITIVE_PROPS_KEY]
          file_key: security.sensitive_props_key
          cli: --sensitive-props-key
          description: Key that encrypts sensitive flow properties (at least 12 characters; changing it breaks an existing flow)
        - name: BH_NIFI_JVM_HEAP_INIT
          type: string
          default: 1g
          aliases: [NIFI_JVM_HEAP_INIT]
          file_key: jvm.heap_init
          cli: --jvm-heap-init
          description: Initial JVM heap (-Xms)
        - name: BH_NIFI_JVM_HEAP_MAX
          type: string
          default: 1g
          aliases: [NIFI_JVM_HEAP_MAX]
          file_key: jvm.heap_max
          cli: --jvm-heap-max
          description: Maximum JVM heap (-Xmx)
        - name: BH_NIFI_DATA_DIR
          type: path
          default: "{{ prefix }}/data"
          file_key: storage.data_dir
          cli: --data-dir
          description: Flow definition, repositories and local state (mount a volume here)
        - name: BH_NIFI_JAVA_HOME
          type: path
          default: "{{ config.root }}/temurin"
          native_env: JAVA_HOME
          file_key: jvm.java_home
          cli: --java-home
          description: Java runtime used by NiFi (21 or later)
    tags:
      - application

  # Built from a git tag pinned by commit (the upstream tarballs are not needed). runtime.env and the configuration template
  # come from `autobuilder.py scaffold` run on the valkey.conf the project ships; only the defaults that cannot work for a
  # service account (dir, pidfile) are edited by hand.
  valkey:
    variant:
      - name: stable
        major_version: 9.1
        patch_version: 3
        full_version: 9.1.3
        commit: 29173b67508b2de4c0f0ed551f3b47cf19fc3ca8
    license: BSD-3-Clause
    website: https://valkey.io/
    depends_on:
      - {name: openssl, variant: stable}
    git:
      repo: https://github.com/valkey-io/valkey
      ref_template: "{{ full_version }}"
    upstream:
      tag_regex: '^(\d+\.\d+\.\d+)$'
    commands:
      make: make -j{{ jobs }} BUILD_TLS=yes OPENSSL_PREFIX={{ deps_prefix }} USE_SYSTEMD=no
      install: make PREFIX={{ prefix }} install
    runtime:
      user:
        name: valkey
        uid: 1003
        gid: 0
        home: "{{ prefix }}"
      dirs:
        - {path: "{{ prefix }}/conf", mode: "g+rwX", owner: "1003:0"}
        - {path: "{{ prefix }}/data", mode: "g+rwX", owner: "1003:0"}
        - {path: "{{ prefix }}/run", mode: "g+rwX", owner: "1003:0"}
      persistence:
        - {path: "{{ prefix }}/data", volume: /bytehawks/data}
      run:
        command:
          - "{{ prefix }}/bin/valkey-server"
          - "{{ prefix }}/conf/valkey.conf"
        stop_signal: TERM
      healthcheck:
        tcp: {host: 127.0.0.1, port: "${BH_VALKEY_PORT}"}
      env:
        - name: BH_VALKEY_BIND
          type: string
          default: 127.0.0.1 -::1
          cli: --bind
          description: You will also need to set a password unless you explicitly disable protected
        - name: BH_VALKEY_PROTECTED_MODE
          type: enum:yes,no
          default: "yes"
          cli: --protected-mode
          description: By default protected mode is enabled. You should disable it only if you are sure you want clients from other hosts to connect to the server even if no...
        - name: BH_VALKEY_PORT
          type: uint
          default: 6379
          cli: --port
          description: 'Accept connections on the specified port, default is 6379 (IANA #815344). If port 0 is specified the server will not listen on a TCP socket.'
        - name: BH_VALKEY_TCP_BACKLOG
          type: uint
          default: 511
          cli: --tcp-backlog
          description: In high requests-per-second environments you need a high backlog in order to avoid slow clients connection issues.
        - name: BH_VALKEY_TIMEOUT
          type: uint
          default: 0
          cli: --timeout
          description: Close the connection after a client is idle for N seconds (0 to disable)
        - name: BH_VALKEY_TCP_KEEPALIVE
          type: uint
          default: 300
          cli: --tcp-keepalive
          description: On Linux, the specified value (in seconds) is the period used to send ACKs. Note that to close the connection the double of the time is needed.
        - name: BH_VALKEY_TLS_PORT
          type: uint
          cli: --tls-port
          description: By default, TLS/SSL is disabled. To enable it, the "tls-port" configuration directive can be used to define TLS-listening ports. To enable TLS on the
        - name: BH_VALKEY_TLS_CERT_FILE
          type: string
          cli: --tls-cert-file
          description: Configure a X.509 certificate and private key to use for authenticating the server to connected clients, primaries or cluster peers.
        - name: BH_VALKEY_TLS_KEY_FILE
          type: string
          cli: --tls-key-file
          description: tls-cert-file valkey.crt
        - name: BH_VALKEY_TLS_CA_CERT_FILE
          type: string
          cli: --tls-ca-cert-file
          description: Configure a CA certificate(s) bundle or directory to authenticate TLS/SSL clients and peers.
        - name: BH_VALKEY_TLS_AUTH_CLIENTS
          type: enum:yes,no
          cli: --tls-auth-clients
          description: If "no" is specified, client certificates are not required and not accepted.
        - name: BH_VALKEY_PIDFILE
          type: path
          default: "{{ prefix }}/run/valkey.pid"
          cli: --pidfile
          description: Note that on modern Linux systems "/run/valkey.pid" is more conforming and should be used instead.
        - name: BH_VALKEY_LOGLEVEL
          type: enum:debug,verbose,notice,warning,nothing
          default: notice
          cli: --loglevel
          description: 'Specify the server verbosity level. This can be one of: debug (a lot of information, useful for development/testing) verbose (many rarely useful info, but not...'
        - name: BH_VALKEY_LOGFILE
          type: string
          cli: --logfile
          description: Specify the log file name. Also the empty string can be used to force the server to log on the standard output.
        - name: BH_VALKEY_DATABASES
          type: uint
          default: 16
          cli: --databases
          description: Set the number of databases. The default database is DB 0, you can select a different one on a per-connection basis using SELECT <dbid> where dbid is a number...
        - name: BH_VALKEY_ALWAYS_SHOW_LOGO
          type: enum:yes,no
          default: "no"
          cli: --always-show-logo
          description: However it is possible to force the pre-4.0 behavior and always show a ASCII art logo in startup logs by setting the following option to yes.
        - name: BH_VALKEY_HIDE_USER_DATA_FROM_LOG
          type: enum:yes,no
          default: "yes"
          cli: --hide-user-data-from-log
          description: User data, including keys, values, client names, and ACL usernames, can be logged as part of assertions and other error cases.
        - name: BH_VALKEY_SET_PROC_TITLE
          type: enum:yes,no
          default: "yes"
          cli: --set-proc-title
          description: By default, the server modifies the process title (as seen in 'top' and 'ps') to provide some runtime information.
        - name: BH_VALKEY_PROC_TITLE_TEMPLATE
          type: string
          default: '{title} {listen-addr} {server-mode}'
          cli: --proc-title-template
          description: '{title} Name of process as executed if parent, or type of child process.'
        - name: BH_VALKEY_LOCALE_COLLATE
          type: string
          cli: --locale-collate
          description: Set the local environment which is used for string comparison operations, and also affect the performance of Lua scripts.
        - name: BH_VALKEY_STOP_WRITES_ON_BGSAVE_ERROR
          type: enum:yes,no
          default: "yes"
          cli: --stop-writes-on-bgsave-error
          description: However if you have setup your proper monitoring of the server and persistence, you may want to disable this feature so that the server will continue to work...
        - name: BH_VALKEY_RDBCOMPRESSION
          type: enum:yes,no
          default: "yes"
          cli: --rdbcompression
          description: Compress string objects using LZF when dump .rdb databases? By default compression is enabled as it's almost always a win.
        - name: BH_VALKEY_RDBCHECKSUM
          type: enum:yes,no
          default: "yes"
          cli: --rdbchecksum
          description: RDB files created with checksum disabled have a checksum of zero that will tell the loading code to skip the check.
        - name: BH_VALKEY_RDB_VERSION_CHECK
          type: string
          default: strict
          cli: --rdb-version-check
          description: Valkey can try to load an RDB dump produced by a future version of Valkey.
        - name: BH_VALKEY_DBFILENAME
          type: string
          default: dump.rdb
          cli: --dbfilename
          description: The filename where to dump the DB
        - name: BH_VALKEY_RDB_DEL_SYNC_FILES
          type: enum:yes,no
          default: "no"
          cli: --rdb-del-sync-files
          description: An alternative (and sometimes better) way to obtain the same effect is to use diskless replication on both primary and replicas instances.
        - name: BH_VALKEY_DIR
          type: path
          default: "{{ prefix }}/data"
          cli: --dir
          description: Note that you must specify a directory here, not a file name.
        - name: BH_VALKEY_REPLICA_SERVE_STALE_DATA
          type: enum:yes,no
          default: "yes"
          cli: --replica-serve-stale-data
          description: 2) If replica-serve-stale-data is set to 'no' the replica will reply with error "MASTERDOWN Link with MASTER is down and replica-serve-stale-data is set to...
        - name: BH_VALKEY_REPLICA_READ_ONLY
          type: enum:yes,no
          default: "yes"
          cli: --replica-read-only
          description: 'Note: read only replicas are not designed to be exposed to untrusted clients on the internet.'
        - name: BH_VALKEY_REPL_DISKLESS_SYNC
          type: enum:yes,no
          default: "yes"
          cli: --repl-diskless-sync
          description: With slow disks and fast (large bandwidth) networks, diskless replication works better.
        - name: BH_VALKEY_REPL_DISKLESS_SYNC_DELAY
          type: uint
          default: 5
          cli: --repl-diskless-sync-delay
          description: The delay is specified in seconds, and by default is 5 seconds. To disable it entirely just set it to 0 seconds and the transfer will start ASAP.
        - name: BH_VALKEY_REPL_DISKLESS_SYNC_MAX_REPLICAS
          type: uint
          default: 0
          cli: --repl-diskless-sync-max-replicas
          description: When diskless replication is enabled with a delay, it is possible to let the replication start before the maximum delay is reached if the maximum number of...
        - name: BH_VALKEY_REPL_DISKLESS_LOAD
          type: enum:enabled,disabled
          default: disabled
          cli: --repl-diskless-load
          description: "\"disabled\" - Don't use diskless load (store the rdb file to the disk first) \"swapdb\" - Keep current db contents in RAM while parsing the data directly from the..."
        - name: BH_VALKEY_DUAL_CHANNEL_REPLICATION_ENABLED
          type: enum:yes,no
          default: "no"
