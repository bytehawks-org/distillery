config:
  # Real path used for builds and RPATH. /opt/bh is only a convenience symlink and is never
  # baked into artifacts. Every path below is rebased by --root.
  root: /opt/bytehawks
  link: /opt/bh
  core_path: /opt/bytehawks/core
  default_download_path: /opt/bytehawks/var/cache/distillery
  default_src_path: /opt/bytehawks/var/build
  log_path: /opt/bytehawks/var/log/distillery
  libraries:
    default_prefix: /opt/bytehawks/deps
  applications:
    default_prefix: /opt/bytehawks/{{ name }}
  # Where built units are kept (see docs/ARTIFACTS.md). `--store` accepts these names, dir:PATH, github[:owner/repo].
  artifacts:
    default_stores: [github]
    # Detached OpenPGP signature of every artifact sidecar (<name>.json.asc; the sidecar holds the tarball sha256 and the recipe).
    # Sign: set `key` (or BH_SIGNING_KEY) - a key of your gpg keyring locally, an imported secret in CI.
    # Verify: restore/chain accept only the listed signers when `require` is true. See docs/ARTIFACTS.md.
    signing:
      key: ""              # key id / fingerprint used to sign; empty = artifacts are not signed
      fingerprints: []     # trusted signers: full 40-hex PRIMARY key fingerprints
      keys: ""             # file or URL with their public keys; empty = take them from the local gpg keyring
      require: false       # true = refuse unsigned artifacts and artifacts signed by anyone else
    stores:
      github:
        type: github                  # GitHub Actions artifacts of this repository (GITHUB_REPOSITORY, GITHUB_TOKEN)
      nexus:
        type: nexus                   # Sonatype Nexus 3 raw (hosted) repository
        url: https://nexus.example.com        # or NEXUS_URL; credentials: NEXUS_USER / NEXUS_PASSWORD
        repository: bytehawks
        prefix: bytehawks
