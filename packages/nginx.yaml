version: 1.0.0
schema: "distillery-package"

package:
  name: nginx
  kind: application
  summary: "HTTP and reverse proxy server"
  license: "BSD-2-Clause"
  website: "https://nginx.org/"
  status: stable
  link: static
  depends_on: [zlib, pcre2, openssl]

  source:
    url: "https://github.com/nginx/nginx/releases/download/release-{{ version }}/nginx-{{ version }}.tar.gz"

  versions:
    - version: "1.26.3"
      sha256: "69ee2b237744036e61d24b836668aad3040dda461fe6f570f1787eab570c75aa"
      variants: [old-legacy]
      series: "1.26"
    - version: "1.28.3"
      sha256: "2c96a946bfb0882a21744ed429770a2123ae1828c7c48665092993ddee91a918"
      variants: [legacy]
      series: "1.28"
    - version: "1.30.6"
      sha256: "3cf46f5ed7504d460125866b7bea99fb357f31d887e2e63b35503310e9b8b6c8"
      variants: [stable]
      series: "1.30"
    - version: "1.31.8"
      sha256: "0652b760b3b772d2ec17b47c2fc15d9a95e6fe35cd5b877eadc1a62d9bc75af1"
      variants: [stream]
      series: "1.31"

  upstream:
    type: github-releases
    repo: nginx/nginx
    tag_regex: '^release-(\d+\.\d+\.\d+)$'

  steps:
    - name: configure
      run: |
        ./configure --prefix="$PREFIX" \
          --with-cc-opt="$CFLAGS $CPPFLAGS" \
          --with-ld-opt="$LDFLAGS" \
          --with-threads --with-file-aio --with-pcre-jit \
          --with-http_ssl_module --with-http_v2_module \
          --with-http_realip_module --with-http_gzip_static_module \
          --with-http_stub_status_module --with-http_sub_module \
          --with-stream --with-stream_ssl_module --with-stream_realip_module
    - name: build
      run: |
        make -j"$JOBS"
    - name: install
      run: |
        make install DESTDIR="$DESTDIR"

  smoke_tests:
    - description: "binary reports the expected version and TLS support"
      run: |
        out="$("$ARTIFACT_ROOT/sbin/nginx" -V 2>&1)"
        grep -q "nginx/{{ version }}" <<<"$out"
        grep -q "built with OpenSSL" <<<"$out"
    - description: "default configuration is valid"
      run: |
        "$ARTIFACT_ROOT/sbin/nginx" -t -p "$ARTIFACT_ROOT" -c conf/nginx.conf

  tags: [web, proxy, core]
