version: 1.0.0
schema: "distillery-package"

package:
  name: php
  kind: application
  summary: "PHP CLI + FPM, static, WordPress-ready extension set"
  license: "PHP-3.01"
  website: "https://www.php.net/"
  # UNTESTED recipe: promote to stable after the first green CI run.
  status: experimental
  link: static
  depends_on: [zlib, openssl, curl, libxml2, oniguruma]

  source:
    url: "https://www.php.net/distributions/php-{{ version }}.tar.xz"

  versions:
    - version: "8.2.35"
      variants: [old-legacy]
      series: "8.2"
    - version: "8.3.36"
      variants: [legacy]
      series: "8.3"
    - version: "8.4.27"
      variants: [stable]
      series: "8.4"
    - version: "8.5.12"
      variants: [stream]
      series: "8.5"

  upstream:
    type: github-tags
    repo: php/php-src
    tag_regex: '^php-(\d+\.\d+\.\d+)$'

  env:
    # static libs needed by the extensions' configure checks
    LIBS: "-ldl -lpthread -lm"

  steps:
    - name: static-opcache
      run: |
        # OPcache is hard-wired as a shared zend_extension. A static binary cannot dlopen it,
        # so build it in and register the zend_extension from a tiny internal module.
        sed -i -e 's/ext_shared=yes/ext_shared=no/' \
               -e 's/shared,,"-Wno-implicit-fallthrough/$ext_shared,,"-Wno-implicit-fallthrough/' \
               ext/opcache/config.m4
        cat > ext/opcache/php_opcache.h <<'EOF_H'
        #ifndef PHP_OPCACHE_H
        #define PHP_OPCACHE_H
        #include "php.h"
        extern zend_module_entry opcache_static_module_entry;
        #define phpext_opcache_ptr (&opcache_static_module_entry)
        #endif
        EOF_H
        cat >> ext/opcache/ZendAccelerator.c <<'EOF_C'

        #ifndef COMPILE_DL_OPCACHE
        static PHP_MINIT_FUNCTION(opcache_static) {
            zend_register_extension(&zend_extension_entry, NULL);
            return SUCCESS;
        }
        zend_module_entry opcache_static_module_entry = {
            STANDARD_MODULE_HEADER, "opcache-static", NULL, PHP_MINIT(opcache_static),
            NULL, NULL, NULL, NULL, "1.0", STANDARD_MODULE_PROPERTIES
        };
        #endif
        EOF_C
        ./buildconf --force
    - name: configure
      run: |
        ./configure --prefix="$PREFIX" \
          --with-config-file-path="$PREFIX/etc" --with-config-file-scan-dir="$PREFIX/etc/php.d" \
          --disable-all --disable-cgi --disable-phpdbg --without-pear \
          --enable-cli --enable-fpm \
          --enable-ctype --enable-dom --enable-fileinfo --enable-filter --enable-mbstring \
          --enable-opcache --enable-pcntl --enable-posix --enable-session --enable-simplexml \
          --enable-sockets --enable-tokenizer --enable-xml --enable-xmlreader --enable-xmlwriter \
          --enable-pdo --enable-bcmath --enable-exif --enable-calendar --enable-mysqlnd \
          --with-mysqli=mysqlnd --with-pdo-mysql=mysqlnd \
          --with-openssl --with-zlib --with-curl --with-libxml --with-iconv
    - name: build
      run: |
        make -j"$JOBS" EXTRA_LDFLAGS_PROGRAM="-all-static"
    - name: install
      run: |
        make install INSTALL_ROOT="$DESTDIR"
        install -d "$DESTDIR$PREFIX/etc/php.d"
        install -m644 php.ini-production "$DESTDIR$PREFIX/etc/php.ini-production"

  smoke_tests:
    - description: "version and extension set"
      run: |
        grep -q "PHP {{ version }}" <<<"$("$ARTIFACT_ROOT/bin/php" -n -v)"
        mods="$("$ARTIFACT_ROOT/bin/php" -n -m)"
        for m in curl dom mbstring mysqli mysqlnd openssl pdo_mysql xml zlib "Zend OPcache"; do
          grep -qix "$m" <<<"$mods"
        done
    - description: "OPcache is active"
      run: |
        "$ARTIFACT_ROOT/bin/php" -n -d opcache.enable_cli=1 \
          -r 'exit(opcache_get_status(false)["opcache_enabled"] ? 0 : 1);'
    - description: "FPM binary is present and static"
      run: |
        grep -q "PHP {{ version }}" <<<"$("$ARTIFACT_ROOT/sbin/php-fpm" -v)"

  tags: [php, language, core]
